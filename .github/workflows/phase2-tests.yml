name: phase2-tests
on:
  pull_request:
    paths: ["smart-pet-vision/**", ".github/workflows/phase2-tests.yml"]
  push:
    branches: [main]
    paths: ["smart-pet-vision/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart-pet-vision/phase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: smart-pet-vision/requirements.txt
      - name: Install pinned dependencies (CPU builds of torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install ruff==0.8.6
      - name: Light lint (syntax errors and invalid statements only)
        run: ruff check --select E9,F63,F7 --output-format concise src tools tests
      - name: Unit tests (no model weights, no network)
        env:
          PYTHONPATH: src
          CUDA_VISIBLE_DEVICES: ""
        run: python -m unittest discover -s tests -v
      - name: Report numbers match saved evidence
        run: python tools/verify_submission_evidence.py
